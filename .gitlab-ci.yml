image: ghcr.io/nosial/ncc:latest

before_script:
  - ncc project install --log-level debug -y

build:
  stage: build
  script:
    - ncc build --configuration release --log-level debug
    - ncc build --configuration debug --log-level debug
  artifacts:
    paths:
      - target/release/net.nosial.configlib.ncc
      - target/debug/net.nosial.configlib.ncc
  rules:
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  dependencies:
    - build
  script:
    - ncc package install --package="target/release/net.nosial.configlib.ncc" --reinstall -y --log-level debug
    - wget https://phar.phpunit.de/phpunit-11.3.phar
    - php phpunit-11.3.phar --configuration phpunit.xml
  rules:
    - if: $CI_COMMIT_BRANCH

release:
  stage: deploy
  script:
    - ncc build --configuration release --log-level debug
    - >
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file target/release/net.nosial.configlib.ncc "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/net.nosial.configlib/$CI_COMMIT_REF_NAME/net.nosial.configlib.ncc"
  artifacts:
    paths:
      - target/release/net.nosial.configlib.ncc
  rules:
    - if: $CI_COMMIT_TAG
